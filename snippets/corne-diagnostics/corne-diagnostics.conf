CONFIG_CORNE_DIAGNOSTICS=y
# zmk-usb-logging provides a CDC port separate from Studio's CDC port.
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=32768
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# These APIs observe PHY updates; the observer never requests a PHY change.
CONFIG_BT_USER_PHY_UPDATE=y
# Keep USB connected for logging while explicitly selecting BLE at the shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_STACK_SIZE=4096
